networks:
  near_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  far_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

services:

  # ─── Normal target ───────────────────────────────────────────────
  # A plain host that replies normally to echo requests.
  # Use: ping 172.20.0.10
  target:
    image: debian:latest
    container_name: ping_target
    networks:
      near_net:
        ipv4_address: 172.20.0.10
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
             echo '[target] Ready — normal echo replies' &&
             tail -f /dev/null"

  # ─── Type 3 — Destination Unreachable ────────────────────────────
  # Rejects all incoming ICMP echo requests with iptables REJECT.
  # Sends back type 3 with the requested code via --reject-with.
  # Use: ping 172.20.0.20
  unreachable:
    image: debian:latest
    container_name: ping_unreachable
    networks:
      near_net:
        ipv4_address: 172.20.0.20
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update -q && apt-get install -y -q iptables &&
             iptables -A INPUT -p icmp --icmp-type echo-request -j REJECT --reject-with icmp-host-unreachable &&
             echo '[unreachable] Ready — will reply type 3 code 1 (host unreachable)' &&
             tail -f /dev/null"

  # ─── Type 3 code 0 — Network Unreachable ─────────────────────────
  # Same as above but returns network unreachable instead of host.
  # Use: ping 172.20.0.21
  net_unreachable:
    image: debian:latest
    container_name: ping_net_unreachable
    networks:
      near_net:
        ipv4_address: 172.20.0.21
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update -q && apt-get install -y -q iptables &&
             iptables -A INPUT -p icmp --icmp-type echo-request -j REJECT --reject-with icmp-net-unreachable &&
             echo '[net_unreachable] Ready — will reply type 3 code 0 (net unreachable)' &&
             tail -f /dev/null"

  # ─── Type 11 — TTL Exceeded ───────────────────────────────────────
  # Acts as a router between near_net and far_net.
  # Forwards packets but the far target is set with a low TTL route
  # so packets die in transit and this router sends back type 11.
  # Use: ping 172.21.0.10 with --ttl 1 from your host
  router:
    image: debian:latest
    container_name: ping_router
    networks:
      near_net:
        ipv4_address: 172.20.0.254
      far_net:
        ipv4_address: 172.21.0.254
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: >
      sh -c "apt-get update -q && apt-get install -y -q iptables iproute2 &&
             echo '[router] Ready — forwards between 172.20.0.0/24 and 172.21.0.0/24' &&
             tail -f /dev/null"

  # ─── Far target (behind router) ──────────────────────────────────
  # Sits on far_net, reachable only through the router.
  # Ping it with --ttl 1 to get a type 11 from the router.
  # Use: ping 172.21.0.10 --ttl 1  →  type 11 from 172.20.0.254
  #      ping 172.21.0.10           →  normal reply (routed)
  far_target:
    image: debian:latest
    container_name: ping_far_target
    networks:
      far_net:
        ipv4_address: 172.21.0.10
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update -q && apt-get install -y -q iproute2 &&
             ip route replace default via 172.21.0.254 &&
             echo '[far_target] Ready — reachable via router at 172.20.0.254' &&
             tail -f /dev/null"
